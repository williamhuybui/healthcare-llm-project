# Sample GraphQL Queries for CSV to GraphQL Service

# 1. Get all users
query GetAllUsers {
  users {
    id
    name
    email
    age
    city
  }
}

# 2. Get a specific user with their orders and products
query GetUserWithOrders {
  user(id: 1) {
    id
    name
    email
    city
    orders {
      id
      quantity
      orderDate
      status
      product {
        name
        price
        category
      }
    }
  }
}

# 3. Get all products with their stock levels
query GetAllProducts {
  products {
    id
    name
    description
    price
    category
    stock
  }
}

# 4. Get a specific product with all orders for it
query GetProductWithOrders {
  product(id: 1) {
    id
    name
    description
    price
    category
    stock
    orders {
      id
      quantity
      orderDate
      status
      user {
        name
        email
        city
      }
    }
  }
}

# 5. Get all orders with complete details
query GetAllOrdersWithDetails {
  orders {
    id
    quantity
    orderDate
    status
    user {
      name
      email
      age
      city
    }
    product {
      name
      description
      price
      category
    }
  }
}

# 6. Get orders by a specific user
query GetOrdersByUser {
  ordersByUser(userId: 2) {
    id
    quantity
    orderDate
    status
    product {
      name
      price
      category
      stock
    }
  }
}

# 7. Get orders for a specific product
query GetOrdersByProduct {
  ordersByProduct(productId: 2) {
    id
    quantity
    orderDate
    status
    user {
      name
      email
      age
    }
  }
}

